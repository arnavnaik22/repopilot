[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "Evidence-first repository investigation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "anthropic>=0.40,<1", "fastembed>=0.4,<1", "streamlit>=1.39,<2", "requests>=2.32,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: requires a hosted LLM"]
